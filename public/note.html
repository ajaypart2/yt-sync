<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code & Text Share</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #6b7280;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --success: #10b981;
            --font-code: "Consolas", "Monaco", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap {
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span.tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-icon-link {
            text-decoration: none;
            color: var(--accent);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #eef2f5;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .nav-icon-link:hover {
            background: #dfe8f2;
            transform: scale(1.04);
        }

        .room-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 6px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .room-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .room-input-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .room-input {
            width: 100px;
            padding: 6px 8px;
            font-family: var(--font-code);
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
        }

        .room-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
        }

        .btn-toggle-mask {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            color: var(--muted);
            border-radius: 4px;
        }

        .btn-toggle-mask:hover {
            color: var(--text);
            background: #f1f5f9;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 65vh;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            line-height: 1.55;
            resize: vertical;
            box-sizing: border-box;
            font-family: var(--font-code);
            background: #fafbfc;
            color: #0f172a;
            tab-size: 2;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 10px;
            padding: 2px 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
            transition: background 0.3s ease;
        }

        .status-dot.saving {
            background: #f59e0b;
            animation: pulse 1s infinite alternate;
        }

        .status-dot.error {
            background: var(--danger);
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.25s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-left {
                justify-content: space-between;
            }
            .room-bar {
                justify-content: space-between;
            }
            textarea {
                min-height: 55vh;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="header-left">
                <a href="/" class="nav-icon-link" title="Back to Dashboard">🏠</a>
                <h1>Code & Text Share <span class="tag">Encrypted URL</span></h1>
            </div>

            <div class="room-bar">
                <span class="room-label">Room:</span>
                <div class="room-input-wrap">
                    <input type="password" id="roomInput" class="room-input" placeholder="code" maxlength="24" title="Room code">
                    <button class="btn-toggle-mask" id="toggleMaskBtn" title="Show/Hide Room Code">👁️</button>
                    <button class="btn btn-outline btn-sm" id="joinRoomBtn" title="Switch to this room">Go</button>
                </div>
                <button class="btn btn-outline btn-sm" id="newRoomBtn" title="Generate a new random room code">🎲 New</button>
                <button class="btn btn-primary btn-sm" id="shareLinkBtn" title="Copy encrypted share link">🔒 Copy Link</button>
                <button class="btn btn-outline btn-sm" id="copyTextBtn" title="Copy text to clipboard">📋 Copy Text</button>
                <button class="btn btn-danger btn-sm" id="eraseBtn" title="Clear current room">🗑️ Clear</button>
            </div>
        </div>

        <div class="card">
            <div class="editor-container">
                <textarea id="noteText" placeholder="Type or paste code / text here... Changes sync in real-time across your devices without saving to any database."></textarea>
            </div>
            
            <div class="status-bar">
                <div class="status-left">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status-right">
                    <span id="statsText">0 lines • 0 chars</span>
                    <span>🔒 URL & ID Encrypted</span>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        const ROOM_SECRET_SALT = 'yt-sync-room-enc-key-v1';

        // --- Client-Side Encryption / Decryption ---
        function encryptRoom(text) {
            if (!text) return '';
            const salt = Math.floor(Math.random() * 0xFFFFFFFF);
            const saltBytes = [
                (salt >> 24) & 0xFF,
                (salt >> 16) & 0xFF,
                (salt >> 8) & 0xFF,
                salt & 0xFF
            ];
            const key = ROOM_SECRET_SALT;
            const inputBytes = [];
            for (let i = 0; i < text.length; i++) inputBytes.push(text.charCodeAt(i));
            let check = 0x5A;
            for (let b of inputBytes) check ^= b;
            inputBytes.push(check);

            const encrypted = [];
            for (let i = 0; i < inputBytes.length; i++) {
                const k = key.charCodeAt(i % key.length) ^ saltBytes[i % 4] ^ ((i * 37) & 0xFF);
                encrypted.push(inputBytes[i] ^ k);
            }

            const allBytes = saltBytes.concat(encrypted);
            let binary = '';
            for (let b of allBytes) binary += String.fromCharCode(b);
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decryptRoom(token) {
            if (!token || typeof token !== 'string') return '';
            try {
                let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const binary = atob(base64);
                if (binary.length < 5) return '';

                const allBytes = [];
                for (let i = 0; i < binary.length; i++) allBytes.push(binary.charCodeAt(i));

                const saltBytes = allBytes.slice(0, 4);
                const encBytes = allBytes.slice(4);
                const key = ROOM_SECRET_SALT;

                const decBytes = [];
                for (let i = 0; i < encBytes.length; i++) {
                    const k = key.charCodeAt(i % key.length) ^ saltBytes[i % 4] ^ ((i * 37) & 0xFF);
                    decBytes.push(encBytes[i] ^ k);
                }

                const check = decBytes.pop();
                let calcCheck = 0x5A;
                for (let b of decBytes) calcCheck ^= b;
                if (check !== calcCheck) return '';

                let result = '';
                for (let b of decBytes) result += String.fromCharCode(b);
                return result;
            } catch (e) {
                return '';
            }
        }

        // --- DOM Elements ---
        const roomInput = document.getElementById('roomInput');
        const toggleMaskBtn = document.getElementById('toggleMaskBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const newRoomBtn = document.getElementById('newRoomBtn');
        const shareLinkBtn = document.getElementById('shareLinkBtn');
        const copyTextBtn = document.getElementById('copyTextBtn');
        const eraseBtn = document.getElementById('eraseBtn');
        const noteText = document.getElementById('noteText');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statsText = document.getElementById('statsText');
        const toast = document.getElementById('toast');

        let currentRoom = '';
        let saveTimer = null;
        let isDirty = false;
        let lastRemoteUpdatedAt = 0;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function generateRandomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function getInitialRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedKey = urlParams.get('key') || urlParams.get('t');
            if (encryptedKey) {
                const dec = decryptRoom(encryptedKey);
                if (dec) return dec;
            }

            const rawRoom = urlParams.get('room');
            if (rawRoom) {
                const dec = decryptRoom(rawRoom);
                return dec || rawRoom.trim().toLowerCase();
            }

            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length >= 2 && pathParts[0] === 'note') {
                const dec = decryptRoom(pathParts[1]);
                return dec || pathParts[1].trim().toLowerCase();
            }

            if (window.location.hash) {
                const hash = window.location.hash.replace(/^#/, '').trim();
                const dec = decryptRoom(hash);
                if (dec) return dec;
                if (hash) return hash.toLowerCase();
            }

            const saved = localStorage.getItem('ytSyncSharedRoom');
            if (saved) return saved;

            return generateRandomCode();
        }

        // Always displays the ENCRYPTED token in the search bar!
        function updateUrlWithEncryptedToken(roomId) {
            const token = encryptRoom(roomId);
            const newUrl = `${window.location.origin}/note?key=${encodeURIComponent(token)}`;
            window.history.replaceState({ room: roomId }, '', newUrl);
            localStorage.setItem('ytSyncSharedRoom', roomId);
            return newUrl;
        }

        function updateStats() {
            const text = noteText.value;
            const lines = text ? text.split('\n').length : 0;
            const chars = text.length;
            statsText.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'} • ${chars} ${chars === 1 ? 'char' : 'chars'}`;
        }

        async function switchRoom(roomId, clearEditor = false) {
            if (!roomId) return;
            const dec = decryptRoom(roomId);
            currentRoom = (dec || roomId).trim().toLowerCase().slice(0, 32);
            roomInput.value = currentRoom;

            // Encrypted URL in search bar
            updateUrlWithEncryptedToken(currentRoom);

            if (clearEditor) {
                noteText.value = '';
                updateStats();
            }

            isDirty = false;
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Connecting to room...';
            await loadRoom(true);
        }

        async function loadRoom(force = false) {
            if (!currentRoom) return;
            if (!force && isDirty) return;

            try {
                // Send encrypted token to server
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}`);
                if (!res.ok) throw new Error('Network error');

                const data = await res.json();
                if (data.success) {
                    const remoteContent = data.content || '';
                    const remoteUpdated = data.updatedAt || 0;

                    if (force || remoteUpdated > lastRemoteUpdatedAt) {
                        if (noteText.value !== remoteContent && !isDirty) {
                            noteText.value = remoteContent;
                            updateStats();
                        }
                        lastRemoteUpdatedAt = remoteUpdated;
                    }

                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connected & in-sync';
                }
            } catch (err) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Reconnecting...';
            }
        }

        async function saveRoom() {
            if (!currentRoom) return;
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Saving...';

            try {
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: noteText.value })
                });

                if (res.ok) {
                    const data = await res.json();
                    lastRemoteUpdatedAt = data.updatedAt || Date.now();
                    isDirty = false;
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Saved (sync active)';
                } else {
                    throw new Error('Save error');
                }
            } catch (err) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Save failed. Retrying...';
            }
        }

        async function eraseRoom() {
            if (!confirm('Clear all code/text in this room?')) return;
            try {
                const token = encryptRoom(currentRoom);
                await fetch(`/api/rooms/${encodeURIComponent(token)}`, { method: 'DELETE' });
                noteText.value = '';
                updateStats();
                isDirty = false;
                statusDot.className = 'status-dot';
                statusText.textContent = 'Room cleared.';
                showToast('Cleared room content');
            } catch (err) {
                alert('Failed to clear room.');
            }
        }

        // --- Event Listeners ---
        noteText.addEventListener('input', () => {
            isDirty = true;
            updateStats();
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Unsaved changes...';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveRoom, 450);
        });

        // Tab key indents by 2 spaces
        noteText.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = noteText.selectionStart;
                const end = noteText.selectionEnd;
                noteText.value = noteText.value.substring(0, start) + '  ' + noteText.value.substring(end);
                noteText.selectionStart = noteText.selectionEnd = start + 2;
                noteText.dispatchEvent(new Event('input'));
            } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                clearTimeout(saveTimer);
                saveRoom();
            }
        });

        // Toggle mask (show/hide password style for Room Input)
        toggleMaskBtn.addEventListener('click', () => {
            if (roomInput.type === 'password') {
                roomInput.type = 'text';
                toggleMaskBtn.textContent = '🔒';
                toggleMaskBtn.title = 'Hide Room Code';
            } else {
                roomInput.type = 'password';
                toggleMaskBtn.textContent = '👁️';
                toggleMaskBtn.title = 'Show Room Code';
            }
        });

        joinRoomBtn.addEventListener('click', () => {
            const val = roomInput.value.trim();
            if (val && val !== currentRoom) {
                switchRoom(val);
            }
        });

        roomInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = roomInput.value.trim();
                if (val && val !== currentRoom) {
                    switchRoom(val);
                }
            }
        });

        newRoomBtn.addEventListener('click', () => {
            const newCode = generateRandomCode();
            switchRoom(newCode, true);
            showToast('Created new private room');
        });

        // Always copy the ENCRYPTED share link!
        shareLinkBtn.addEventListener('click', async () => {
            const token = encryptRoom(currentRoom);
            const shareUrl = `${window.location.origin}/note?key=${encodeURIComponent(token)}`;
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareUrl);
                } else {
                    const temp = document.createElement('input');
                    temp.value = shareUrl;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                }
                showToast('🔒 Encrypted share link copied!');
            } catch (e) {
                prompt('Copy this encrypted link:', shareUrl);
            }
        });

        copyTextBtn.addEventListener('click', async () => {
            if (!noteText.value) {
                showToast('Nothing to copy!');
                return;
            }
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(noteText.value);
                } else {
                    noteText.select();
                    document.execCommand('copy');
                }
                showToast('Text copied to clipboard!');
            } catch (e) {
                showToast('Failed to copy text.');
            }
        });

        eraseBtn.addEventListener('click', eraseRoom);

        // Sync polling every 2 seconds
        setInterval(() => {
            if (currentRoom) {
                loadRoom();
            }
        }, 2000);

        // Initialize
        const initialRoom = getInitialRoom();
        switchRoom(initialRoom);
    </script>
</body>
</html>
