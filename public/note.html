<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code, Text & File Share</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #6b7280;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --success: #10b981;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --font-code: "Consolas", "Monaco", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .wrap {
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span.tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-icon-link {
            text-decoration: none;
            color: var(--accent);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #eef2f5;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .nav-icon-link:hover {
            background: #dfe8f2;
            transform: scale(1.04);
        }

        .room-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 6px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .room-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .room-input-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .room-input {
            width: 100px;
            padding: 6px 8px;
            font-family: var(--font-code);
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
        }

        .room-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
        }

        .btn-toggle-mask {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            color: var(--muted);
            border-radius: 4px;
        }

        .btn-toggle-mask:hover {
            color: var(--text);
            background: #f1f5f9;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }

        /* --- File Sharing Section --- */
        .files-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .files-card.highlight {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .files-title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-warning {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 10px 14px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: #eff6ff;
            color: var(--accent);
        }

        .files-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .file-item {
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .file-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            background: #ffffff;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-grow: 1;
        }

        .file-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .file-details {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-name {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 11px;
            color: var(--muted);
        }

        .file-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .empty-files {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            padding: 10px;
            font-style: italic;
        }

        /* --- Text/Code Editor Section --- */
        .editor-card {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 120px;
            height: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            box-sizing: border-box;
            font-family: var(--font-code);
            background: #fafbfc;
            color: #0f172a;
            tab-size: 2;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 10px;
            padding: 2px 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
            transition: background 0.3s ease;
        }

        .status-dot.saving {
            background: #f59e0b;
            animation: pulse 1s infinite alternate;
        }

        .status-dot.error {
            background: var(--danger);
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.25s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .wrap {
                height: auto;
                padding: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-left {
                justify-content: space-between;
            }
            .room-bar {
                justify-content: space-between;
            }
            textarea {
                min-height: 30vh;
                height: 35vh;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="header-left">
                <a href="/" class="nav-icon-link" title="Back to Dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
                <h1>Code, Text & File Share <span class="tag">In-Memory Sync</span></h1>
            </div>

            <div class="room-bar">
                <span class="room-label">Room:</span>
                <div class="room-input-wrap">
                    <input type="password" id="roomInput" class="room-input" placeholder="code" maxlength="24" title="Room code">
                    <button class="btn-toggle-mask" id="toggleMaskBtn" title="Show/Hide Room Code">👁️</button>
                    <button class="btn btn-outline btn-sm" id="joinRoomBtn" title="Switch to this room">Go</button>
                </div>
                <button class="btn btn-outline btn-sm" id="newRoomBtn" title="Generate a new random room code">🎲 New</button>
                <button class="btn btn-primary btn-sm" id="shareLinkBtn" title="Copy encrypted share link">🔒 Copy Link</button>
                <button class="btn btn-outline btn-sm" id="copyTextBtn" title="Copy text to clipboard">📋 Copy Text</button>
                <button class="btn btn-danger btn-sm" id="eraseBtn" title="Clear current room">🗑️ Clear</button>
            </div>
        </div>

        <!-- Ephemeral File Sharing Section -->
        <div class="card files-card" id="filesSection">
            <div class="files-header">
                <div class="files-title">
                    <span>📁 Shared Files</span>
                    <span class="tag-warning">Auto-purged in 30m</span>
                </div>
                <div class="files-actions">
                    <input type="file" id="fileInput" style="display: none;">
                    <button class="btn btn-primary btn-sm" id="uploadBtn" title="Choose file to share">
                        <span>➕ Attach File</span>
                    </button>
                </div>
            </div>

            <div class="drop-zone" id="dropZone">
                <span>📤 Drag & drop any file here (Max 25MB), or click to upload</span>
            </div>

            <div class="files-list" id="filesList">
                <div class="empty-files">No files in this room yet. Upload a file to share it across devices.</div>
            </div>
        </div>

        <!-- Text & Code Editor Section -->
        <div class="card editor-card">
            <div class="editor-container">
                <textarea id="noteText" placeholder="Type or paste code / text here... Changes sync in real-time across your devices without saving to any database."></textarea>
            </div>
            
            <div class="status-bar">
                <div class="status-left">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status-right">
                    <span id="statsText">0 lines • 0 chars</span>
                    <span>🔒 In-Memory & Encrypted</span>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        const ROOM_SECRET_SALT = 'yt-sync-room-enc-key-v1';

        // --- Client-Side Encryption / Decryption ---
        function encryptRoom(text) {
            if (!text) return '';
            const salt = Math.floor(Math.random() * 0xFFFFFFFF);
            const saltBytes = [
                (salt >> 24) & 0xFF,
                (salt >> 16) & 0xFF,
                (salt >> 8) & 0xFF,
                salt & 0xFF
            ];
            const key = ROOM_SECRET_SALT;
            const inputBytes = [];
            for (let i = 0; i < text.length; i++) inputBytes.push(text.charCodeAt(i));
            let check = 0x5A;
            for (let b of inputBytes) check ^= b;
            inputBytes.push(check);

            const encrypted = [];
            for (let i = 0; i < inputBytes.length; i++) {
                const k = key.charCodeAt(i % key.length) ^ saltBytes[i % 4] ^ ((i * 37) & 0xFF);
                encrypted.push(inputBytes[i] ^ k);
            }

            const allBytes = saltBytes.concat(encrypted);
            let binary = '';
            for (let b of allBytes) binary += String.fromCharCode(b);
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decryptRoom(token) {
            if (!token || typeof token !== 'string') return '';
            try {
                let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const binary = atob(base64);
                if (binary.length < 5) return '';

                const allBytes = [];
                for (let i = 0; i < binary.length; i++) allBytes.push(binary.charCodeAt(i));

                const saltBytes = allBytes.slice(0, 4);
                const encBytes = allBytes.slice(4);
                const key = ROOM_SECRET_SALT;

                const decBytes = [];
                for (let i = 0; i < encBytes.length; i++) {
                    const k = key.charCodeAt(i % key.length) ^ saltBytes[i % 4] ^ ((i * 37) & 0xFF);
                    decBytes.push(encBytes[i] ^ k);
                }

                const check = decBytes.pop();
                let calcCheck = 0x5A;
                for (let b of decBytes) calcCheck ^= b;
                if (check !== calcCheck) return '';

                let result = '';
                for (let b of decBytes) result += String.fromCharCode(b);
                return result;
            } catch (e) {
                return '';
            }
        }

        // --- Format Helpers ---
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function getFileIcon(filename) {
            const ext = (filename.split('.').pop() || '').toLowerCase();
            if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp'].includes(ext)) return '🖼️';
            if (['zip', 'rar', 'tar', 'gz', '7z', 'bz2'].includes(ext)) return '📦';
            if (['pdf'].includes(ext)) return '📕';
            if (['js', 'ts', 'jsx', 'tsx', 'html', 'css', 'json', 'py', 'java', 'c', 'cpp', 'rs', 'go', 'php'].includes(ext)) return '📜';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return '🎵';
            if (['mp4', 'mkv', 'avi', 'mov', 'webm'].includes(ext)) return '🎬';
            return '📄';
        }

        function getTimeRemainingText(expiresAt) {
            if (!expiresAt) return '';
            const remainingSec = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
            const mins = Math.floor(remainingSec / 60);
            if (mins <= 0) return 'Expiring soon';
            return `Expires in ~${mins}m`;
        }

        // --- DOM Elements ---
        const roomInput = document.getElementById('roomInput');
        const toggleMaskBtn = document.getElementById('toggleMaskBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const newRoomBtn = document.getElementById('newRoomBtn');
        const shareLinkBtn = document.getElementById('shareLinkBtn');
        const copyTextBtn = document.getElementById('copyTextBtn');
        const eraseBtn = document.getElementById('eraseBtn');
        const noteText = document.getElementById('noteText');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statsText = document.getElementById('statsText');
        const toast = document.getElementById('toast');

        // File elements
        const filesSection = document.getElementById('filesSection');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const dropZone = document.getElementById('dropZone');
        const filesList = document.getElementById('filesList');

        let currentRoom = '';
        let saveTimer = null;
        let isDirty = false;
        let lastRemoteUpdatedAt = 0;
        let knownFilesJson = '';

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function generateRandomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function getInitialRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const encryptedKey = urlParams.get('key') || urlParams.get('t');
            if (encryptedKey) {
                const dec = decryptRoom(encryptedKey);
                if (dec) return dec;
            }

            const rawRoom = urlParams.get('room');
            if (rawRoom) {
                const dec = decryptRoom(rawRoom);
                return dec || rawRoom.trim().toLowerCase();
            }

            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length >= 2 && pathParts[0] === 'note') {
                const dec = decryptRoom(pathParts[1]);
                return dec || pathParts[1].trim().toLowerCase();
            }

            if (window.location.hash) {
                const cleanHash = window.location.hash.replace(/^#/, '').trim();
                if (cleanHash && cleanHash !== 'files') {
                    const dec = decryptRoom(cleanHash);
                    if (dec) return dec;
                    return cleanHash.toLowerCase();
                }
            }

            // Always generate a fresh random room code if no specific key/room in URL
            localStorage.removeItem('ytSyncSharedRoom');
            return generateRandomCode();
        }

        function updateUrlWithEncryptedToken(roomId) {
            const token = encryptRoom(roomId);
            const hash = window.location.hash || '';
            const newUrl = `${window.location.origin}/note?key=${encodeURIComponent(token)}${hash}`;
            window.history.replaceState({ room: roomId }, '', newUrl);
            return newUrl;
        }

        function updateStats() {
            const text = noteText.value;
            const lines = text ? text.split('\n').length : 0;
            const chars = text.length;
            statsText.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'} • ${chars} ${chars === 1 ? 'char' : 'chars'}`;
        }

        function renderFiles(files) {
            const json = JSON.stringify(files);
            if (json === knownFilesJson) return;
            knownFilesJson = json;

            if (!files || files.length === 0) {
                filesList.innerHTML = '<div class="empty-files">No files in this room yet. Upload a file to share it across devices.</div>';
                return;
            }

            const token = encryptRoom(currentRoom);
            filesList.innerHTML = files.map(file => {
                const icon = getFileIcon(file.name);
                const sizeStr = formatBytes(file.size);
                const timeStr = getTimeRemainingText(file.expiresAt);
                const downloadUrl = `/api/rooms/${encodeURIComponent(token)}/files/${encodeURIComponent(file.id)}`;

                return `
                    <div class="file-item">
                        <div class="file-info">
                            <span class="file-icon">${icon}</span>
                            <div class="file-details">
                                <div class="file-name" title="${file.name}">${file.name}</div>
                                <div class="file-meta">${sizeStr} • ${timeStr}</div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <a class="btn btn-primary btn-sm" href="${downloadUrl}" download="${file.name}" title="Download file">⬇️ Download</a>
                            <button class="btn btn-danger btn-sm" onclick="deleteFile('${file.id}')" title="Delete file from room">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function switchRoom(roomId, clearEditor = false) {
            if (!roomId) return;
            const dec = decryptRoom(roomId);
            currentRoom = (dec || roomId).trim().toLowerCase().slice(0, 32);
            roomInput.value = currentRoom;

            updateUrlWithEncryptedToken(currentRoom);

            if (clearEditor) {
                noteText.value = '';
                updateStats();
            }

            isDirty = false;
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Connecting to room...';
            await loadRoom(true);
        }

        async function loadRoom(force = false) {
            if (!currentRoom) return;
            if (!force && isDirty) return;

            try {
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}`);
                if (!res.ok) throw new Error('Network error');

                const data = await res.json();
                if (data.success) {
                    const remoteContent = data.content || '';
                    const remoteUpdated = data.updatedAt || 0;

                    if (force || remoteUpdated > lastRemoteUpdatedAt) {
                        if (noteText.value !== remoteContent && !isDirty) {
                            noteText.value = remoteContent;
                            updateStats();
                        }
                        lastRemoteUpdatedAt = remoteUpdated;
                    }

                    // Render active files
                    renderFiles(data.files || []);

                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connected & in-sync';
                }
            } catch (err) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Reconnecting...';
            }
        }

        async function saveRoom() {
            if (!currentRoom) return;
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Saving...';

            try {
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: noteText.value })
                });

                if (res.ok) {
                    const data = await res.json();
                    lastRemoteUpdatedAt = data.updatedAt || Date.now();
                    isDirty = false;
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Saved (sync active)';
                } else {
                    throw new Error('Save error');
                }
            } catch (err) {
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Save failed. Retrying...';
            }
        }

        async function eraseRoom() {
            if (!confirm('Clear all code, text and files in this room?')) return;
            try {
                const token = encryptRoom(currentRoom);
                await fetch(`/api/rooms/${encodeURIComponent(token)}`, { method: 'DELETE' });
                noteText.value = '';
                updateStats();
                isDirty = false;
                renderFiles([]);
                statusDot.className = 'status-dot';
                statusText.textContent = 'Room cleared.';
                showToast('Cleared room content & files');
            } catch (err) {
                alert('Failed to clear room.');
            }
        }

        // --- File Upload & Delete Logic ---
        async function uploadFile(file) {
            if (!file) return;
            if (file.size > 25 * 1024 * 1024) {
                alert(`File "${file.name}" exceeds the 25MB in-memory limit.`);
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            statusDot.className = 'status-dot saving';
            statusText.textContent = `Uploading ${file.name}...`;
            showToast(`Uploading ${file.name}...`);

            try {
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}/files`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || 'Upload failed');
                }

                showToast(`Uploaded ${file.name}`);
                await loadRoom(true);
            } catch (err) {
                alert(`Upload failed: ${err.message}`);
                statusDot.className = 'status-dot error';
                statusText.textContent = 'Upload failed.';
            }
        }

        window.deleteFile = async function(fileId) {
            if (!confirm('Remove this file from the room?')) return;
            try {
                const token = encryptRoom(currentRoom);
                const res = await fetch(`/api/rooms/${encodeURIComponent(token)}/files/${encodeURIComponent(fileId)}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    showToast('File removed');
                    await loadRoom(true);
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert('Failed to remove file');
            }
        };

        // --- File Upload Listeners ---
        uploadBtn.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                uploadFile(e.target.files[0]);
                fileInput.value = '';
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                uploadFile(e.dataTransfer.files[0]);
            }
        });

        // --- Text/Code Event Listeners ---
        noteText.addEventListener('input', () => {
            isDirty = true;
            updateStats();
            statusDot.className = 'status-dot saving';
            statusText.textContent = 'Unsaved changes...';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveRoom, 450);
        });

        noteText.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = noteText.selectionStart;
                const end = noteText.selectionEnd;
                noteText.value = noteText.value.substring(0, start) + '  ' + noteText.value.substring(end);
                noteText.selectionStart = noteText.selectionEnd = start + 2;
                noteText.dispatchEvent(new Event('input'));
            } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                clearTimeout(saveTimer);
                saveRoom();
            }
        });

        toggleMaskBtn.addEventListener('click', () => {
            if (roomInput.type === 'password') {
                roomInput.type = 'text';
                toggleMaskBtn.textContent = '🔒';
                toggleMaskBtn.title = 'Hide Room Code';
            } else {
                roomInput.type = 'password';
                toggleMaskBtn.textContent = '👁️';
                toggleMaskBtn.title = 'Show Room Code';
            }
        });

        joinRoomBtn.addEventListener('click', () => {
            const val = roomInput.value.trim();
            if (val && val !== currentRoom) {
                switchRoom(val);
            }
        });

        roomInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = roomInput.value.trim();
                if (val && val !== currentRoom) {
                    switchRoom(val);
                }
            }
        });

        newRoomBtn.addEventListener('click', () => {
            const newCode = generateRandomCode();
            switchRoom(newCode, true);
            showToast('Created new private room');
        });

        shareLinkBtn.addEventListener('click', async () => {
            const token = encryptRoom(currentRoom);
            const shareUrl = `${window.location.origin}/note?key=${encodeURIComponent(token)}`;
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareUrl);
                } else {
                    const temp = document.createElement('input');
                    temp.value = shareUrl;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                }
                showToast('🔒 Encrypted share link copied!');
            } catch (e) {
                prompt('Copy this encrypted link:', shareUrl);
            }
        });

        copyTextBtn.addEventListener('click', async () => {
            if (!noteText.value) {
                showToast('Nothing to copy!');
                return;
            }
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(noteText.value);
                } else {
                    noteText.select();
                    document.execCommand('copy');
                }
                showToast('Text copied to clipboard!');
            } catch (e) {
                showToast('Failed to copy text.');
            }
        });

        eraseBtn.addEventListener('click', eraseRoom);

        // Sync polling every 2 seconds
        setInterval(() => {
            if (currentRoom) {
                loadRoom();
            }
        }, 2000);

        // Initialize
        const initialRoom = getInitialRoom();
        switchRoom(initialRoom);

        // Check if coming from #files anchor
        if (window.location.hash === '#files') {
            setTimeout(() => {
                filesSection.scrollIntoView({ behavior: 'smooth' });
                filesSection.classList.add('highlight');
                setTimeout(() => filesSection.classList.remove('highlight'), 1800);
            }, 300);
        }
    </script>
</body>
</html>
